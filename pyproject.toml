[project]
name = "voting-drf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "coverage>=7.13.4",
    "django-cors-headers>=4.9.0",
    "django-debug-toolbar>=6.2.0",
    "django-random-queryset>=0.2.0",
    "djangorestframework>=3.16.1",
    "drf-yasg>=1.21.14",
    "factory-boy>=3.3.3",
    "flake8>=7.3.0",
    "gunicorn>=25.1.0",
    "ipython>=9.10.0",
    "pillow>=12.1.1",
    "psycopg2-binary>=2.9.11",
    "pytest-django>=4.12.0",
    "python-dotenv>=1.2.1",
    "whitenoise>=6.11.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = "test_*.py"
addopts = [
    "--disable-warnings",
    "--reuse-db",
]

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/admin.py",
]
